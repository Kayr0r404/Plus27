services:
  postgres:
    image: postgres:16-alpine
    container_name: plus27-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-plus27_db}
      POSTGRES_USER: ${POSTGRES_DB_USER:-fastapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-your-postgres-password}
    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER:-fastapi_user} -d ${POSTGRES_DB_NAME:-plus27_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: plus27-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_DB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
